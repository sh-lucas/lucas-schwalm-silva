  <style>
    /* Critical base styles to prevent any initial flash or layout jump */
    :root {
      --bg: #0b0d10;
      --bg-glow: rgba(226, 232, 240, 0.035);
      --text-primary: #eceef2;
      --font-sans: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
    }

    html, body {
      background-color: var(--bg);
      background-image: radial-gradient(
        ellipse 80% 45% at 50% -10%,
        var(--bg-glow),
        transparent 70%
      );
      background-repeat: no-repeat;
      color: var(--text-primary);
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Fallback card for users without JavaScript */
    .noscript-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    .noscript-card {
      width: 100%;
      max-width: 44rem;
      background: #11141a;
      border: 1px solid #303745;
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .noscript-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #f85149;
    }

    .noscript-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149;
    }

    .noscript-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #eceef2;
      margin: 0;
    }

    .noscript-text {
      color: #a5aebc;
      font-size: 0.9375rem;
      line-height: 1.6;
      margin: 0;
    }

    .noscript-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .noscript-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      background: #161a22;
      border: 1px solid #1f242e;
      border-radius: 6px;
      color: #eceef2;
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: border-color 150ms ease;
    }

    .noscript-link:hover {
      border-color: #303745;
    }
  </style>
</head>
